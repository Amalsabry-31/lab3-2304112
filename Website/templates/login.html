<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Todo Time - Login</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23800020'/><text x='50' y='68' font-size='60' text-anchor='middle' fill='white'>✓</text></svg>">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/theme.js"></script>
</head>
<body>
    <div class="navbar">
        <span class="brand"><span class="logo">✓</span> Todo Time</span>
        <button type="button" class="theme-btn" onclick="toggleTheme()">🌙</button>
    </div>

    <div class="container">
        <div class="card">
            <h1>Log in</h1>

            <span class="error" id="err_general">{% if errors.general %}{{ errors.general }}{% endif %}</span>

            <form id="loginForm" method="POST" action="/login" autocomplete="off" novalidate>
                <div class="form-row">
                    <label>Email</label>
                    <input type="text" name="email" value="{{ email }}" autocomplete="off">
                    <span class="error" id="err_email">{% if errors.email %}{{ errors.email }}{% endif %}</span>
                </div>
                <div class="form-row">
                    <label>Password</label>
                    <input type="password" name="password" autocomplete="new-password">
                    <span class="error" id="err_password">{% if errors.password %}{{ errors.password }}{% endif %}</span>
                </div>
                <button type="submit">Log in</button>
            </form>

            <p class="link-text">Don't have an account? <a href="/register">Register</a></p>
        </div>
    </div>

    <script>
        window.addEventListener("pageshow", function (event) {
            if (event.persisted) { window.location.reload(); }
        });

        document.getElementById("loginForm").addEventListener("submit", function (event) {
            var form = event.target;
            var emailError = form.email.value.trim() === "" ? "Email is required" : "";
            var passwordError = form.password.value === "" ? "Password is required" : "";

            document.getElementById("err_general").textContent = "";
            document.getElementById("err_email").textContent = emailError;
            document.getElementById("err_password").textContent = passwordError;

            if (emailError || passwordError) {
                event.preventDefault();
            }
        });
    </script>
</body>
</html>
